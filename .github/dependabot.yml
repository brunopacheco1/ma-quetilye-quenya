# Dependabot opens pull requests to keep the workflow actions and the Python tools used in CI up to date.
# Security alerts and security updates are switched on in the repository settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      python-tools:
        patterns: ["*"]
